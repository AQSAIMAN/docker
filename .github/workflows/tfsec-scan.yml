name: tfsec-scan

on:
  pull_request:
  push:
    branches: [master]

jobs:
  tfsec:
    name: Terraform scan (tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: true
        with:
          working_directory: .